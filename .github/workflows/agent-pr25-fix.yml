name: Apply verified animation output fix

on:
  push:
    branches:
      - fix/animated-raw-fanout-logging
    paths:
      - .github/workflows/agent-pr25-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: fix/animated-raw-fanout-logging
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply focused fix and regression coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          image_path = Path("src/image.ts")
          image = image_path.read_text()

          image = replace_once(
              image,
              '''async function renderOutputs(
            raw: RawBase,
          ''',
              '''type OutputAnimationExpectation = {
            sourcePages: number;
            sourceDelays: number[];
            totalDurationMilliseconds: bigint;
            loop: number;
            canCollapseToStatic: boolean;
          };

          function createOutputAnimationExpectation(
            raw: RawBase,
            metadata: SharpMetadata,
            outputPages: number,
          ): OutputAnimationExpectation {
            if (outputPages === 1) {
              return {
                sourcePages: 1,
                sourceDelays: [],
                totalDurationMilliseconds: 0n,
                loop: 0,
                canCollapseToStatic: false,
              };
            }

            const delays = metadata.delay;
            if (!delays || delays.length !== outputPages) {
              throw new MediaProcessingError(
                "processing_failed",
                "Animated image timing metadata changed after validation",
              );
            }
            const sourceDelays = delays.map((delay) => (delay <= 10 ? 100 : delay));

            return {
              sourcePages: outputPages,
              sourceDelays,
              totalDurationMilliseconds: sourceDelays.reduce(
                (total, delay) => total + BigInt(delay),
                0n,
              ),
              loop: metadata.loop ?? 0,
              canCollapseToStatic: decodedFramesAreIdentical(raw, outputPages),
            };
          }

          function decodedFramesAreIdentical(raw: RawBase, pages: number): boolean {
            const frameBytes = raw.width * raw.pageHeight * raw.channels;
            const totalBytes = frameBytes * pages;
            if (
              !Number.isSafeInteger(frameBytes) ||
              !Number.isSafeInteger(totalBytes) ||
              frameBytes <= 0 ||
              totalBytes !== raw.bytes.length
            ) {
              throw new MediaProcessingError(
                "processing_failed",
                "Decoded animation buffer geometry is invalid",
              );
            }

            const first = raw.bytes.subarray(0, frameBytes);
            for (let page = 1; page < pages; page += 1) {
              const offset = page * frameBytes;
              if (!first.equals(raw.bytes.subarray(offset, offset + frameBytes))) {
                return false;
              }
            }
            return true;
          }

          async function renderOutputs(
            raw: RawBase,
          ''',
              "insert animation expectation helpers",
          )

          image = replace_once(
              image,
              '''): Promise<ProcessedImageOutput[]> {
            const outputs = new Array<ProcessedImageOutput>(recipe.outputs.length);
          ''',
              '''): Promise<ProcessedImageOutput[]> {
            const animationExpectation = createOutputAnimationExpectation(
              raw,
              metadata,
              outputPages,
            );
            const outputs = new Array<ProcessedImageOutput>(recipe.outputs.length);
          ''',
              "create animation expectation once",
          )

          image = replace_once(
              image,
              '''          raw,
                    metadata,
                    outputPages,
                    output,
                    options,
          ''',
              '''          raw,
                    metadata,
                    outputPages,
                    animationExpectation,
                    output,
                    options,
          ''',
              "pass animation expectation",
          )

          image = replace_once(
              image,
              '''  metadata: SharpMetadata,
            outputPages: number,
            recipe: ImageOutputRecipe,
          ''',
              '''  metadata: SharpMetadata,
            outputPages: number,
            animationExpectation: OutputAnimationExpectation,
            recipe: ImageOutputRecipe,
          ''',
              "extend renderOutput signature",
          )

          image = replace_once(
              image,
              '''    const bytes = Buffer.concat(chunks, Number(outputBytes));
              const pages = info.pages ?? 1;
              const height = info.pageHeight ?? info.height;
              if (!Number.isInteger(pages) || pages < 1 || pages > outputPages) {
                throw new MediaProcessingError(
                  "processing_failed",
                  "Image encoder reported an invalid output page count",
                );
              }
              assertBudget(
                multiplyBigInt(info.width, height, pages),
                options.maxOutputPixels,
                `Output ${recipe.outputId} exceeds the pixel limit`,
              );
              await verifySanitizedOutput(
                bytes,
                info.width,
                height,
                pages,
                options.deadlineMilliseconds,
                signal,
              );
              return {
                outputId: recipe.outputId,
                filename: `${recipe.outputId}.webp`,
                bytes,
                manifest: {
                  mime_type: "image/webp",
                  extension: "webp",
                  byte_length: bytes.length,
                  width: info.width,
                  height,
                  animated: pages > 1,
                  pages,
                  digest: sha256Digest(bytes),
                },
              };
          ''',
              '''    const bytes = Buffer.concat(chunks, Number(outputBytes));
              const expectedHeight = info.pageHeight ?? info.height;
              const verified = await verifySanitizedOutput(
                bytes,
                info.width,
                expectedHeight,
                animationExpectation,
                options.deadlineMilliseconds,
                signal,
              );
              if (info.pages !== undefined && info.pages !== verified.pages) {
                throw outputContractError("encoder metadata page count mismatch");
              }
              assertBudget(
                multiplyBigInt(verified.width, verified.height, verified.pages),
                options.maxOutputPixels,
                `Output ${recipe.outputId} exceeds the pixel limit`,
              );
              return {
                outputId: recipe.outputId,
                filename: `${recipe.outputId}.webp`,
                bytes,
                manifest: {
                  mime_type: "image/webp",
                  extension: "webp",
                  byte_length: bytes.length,
                  width: verified.width,
                  height: verified.height,
                  animated: verified.pages > 1,
                  pages: verified.pages,
                  digest: sha256Digest(bytes),
                },
              };
          ''',
              "use verified encoder output metadata",
          )

          image = replace_once(
              image,
              '''async function verifySanitizedOutput(
            bytes: Buffer,
            width: number,
            height: number,
            pages: number,
            deadlineMilliseconds: number,
            signal: AbortSignal,
          ): Promise<void> {
            if (detectMediaKind(bytes) !== "image") {
              throw new MediaProcessingError(
                "processing_failed",
                "Encoder output magic is invalid",
              );
            }
            const verifier = sharp(bytes, { animated: true, pages: -1 }).timeout({
              seconds: Math.ceil(deadlineMilliseconds / 1000),
            });
            const abort = () => verifier.destroy(signal.reason);
            signal.addEventListener("abort", abort, { once: true });
            let metadata: SharpMetadata;
            try {
              metadata = await verifier.metadata();
            } catch {
              throwIfProcessingAborted(signal);
              throw new MediaProcessingError(
                "processing_failed",
                "Encoder output cannot be verified",
              );
            } finally {
              signal.removeEventListener("abort", abort);
              verifier.destroy();
            }
            if (
              metadata.format !== "webp" ||
              metadata.width !== width ||
              sourceFrameHeight(metadata, metadata.pages ?? 1) !== height ||
              (metadata.pages ?? 1) !== pages ||
              metadata.exif !== undefined ||
              metadata.icc !== undefined ||
              metadata.xmp !== undefined ||
              metadata.iptc !== undefined
            ) {
              throw new MediaProcessingError(
                "processing_failed",
                "Encoder output contract verification failed",
              );
            }
          }
          ''',
              '''type VerifiedOutput = {
            width: number;
            height: number;
            pages: number;
          };

          async function verifySanitizedOutput(
            bytes: Buffer,
            width: number,
            height: number,
            animation: OutputAnimationExpectation,
            deadlineMilliseconds: number,
            signal: AbortSignal,
          ): Promise<VerifiedOutput> {
            if (detectMediaKind(bytes) !== "image") {
              throw outputContractError("invalid output magic");
            }
            const verifier = sharp(bytes, { animated: true, pages: -1 }).timeout({
              seconds: Math.ceil(deadlineMilliseconds / 1000),
            });
            const abort = () => verifier.destroy(signal.reason);
            signal.addEventListener("abort", abort, { once: true });
            let metadata: SharpMetadata;
            try {
              metadata = await verifier.metadata();
            } catch {
              throwIfProcessingAborted(signal);
              throw outputContractError("output cannot be decoded");
            } finally {
              signal.removeEventListener("abort", abort);
              verifier.destroy();
            }

            const pages = metadata.pages ?? 1;
            if (
              !Number.isInteger(pages) ||
              pages < 1 ||
              pages > animation.sourcePages
            ) {
              throw outputContractError("invalid page count");
            }
            const frameHeight = sourceFrameHeight(metadata, pages);
            if (
              metadata.format !== "webp" ||
              metadata.width !== width ||
              frameHeight !== height
            ) {
              throw outputContractError("format or geometry mismatch");
            }
            if (
              metadata.exif !== undefined ||
              metadata.icc !== undefined ||
              metadata.xmp !== undefined ||
              metadata.iptc !== undefined
            ) {
              throw outputContractError("metadata was not stripped");
            }

            if (animation.sourcePages === 1) {
              if (pages !== 1) {
                throw outputContractError("static source became animated");
              }
            } else if (pages === 1) {
              if (!animation.canCollapseToStatic) {
                throw outputContractError("non-identical frames collapsed to static");
              }
            } else {
              const delays = metadata.delay;
              if (!delays || delays.length !== pages) {
                throw outputContractError("animation timing metadata is invalid");
              }
              const duration = delays.reduce(
                (total, delay) => total + BigInt(delay),
                0n,
              );
              if (duration !== animation.totalDurationMilliseconds) {
                throw outputContractError("animation duration changed");
              }
              if ((metadata.loop ?? 0) !== animation.loop) {
                throw outputContractError("animation loop changed");
              }
              if (
                pages === animation.sourcePages &&
                delays.some(
                  (delay, index) => delay !== animation.sourceDelays[index],
                )
              ) {
                throw outputContractError("animation frame timing changed");
              }
            }

            return { width, height, pages };
          }

          function outputContractError(reason: string): MediaProcessingError {
            return new MediaProcessingError(
              "processing_failed",
              `Encoder output contract verification failed: ${reason}`,
            );
          }
          ''',
              "replace output verifier",
          )

          image_path.write_text(image)

          test_path = Path("src/image.animation-regression.test.ts")
          test = test_path.read_text()

          test = replace_once(
              test,
              '''async function duplicateFrameGif(): Promise<Buffer> {
            const frame = await solidFrame("#336699ff");
            return encodeGif(Array(FRAME_COUNT).fill(frame), true);
          }
          ''',
              '''async function duplicateFrameGif(): Promise<Buffer> {
            const frame = await solidFrame("#336699ff");
            return encodeGif(Array(FRAME_COUNT).fill(frame), true);
          }

          async function groupedDuplicateFrameGif(): Promise<Buffer> {
            const first = await solidFrame("#336699ff");
            const second = await solidFrame("#cc6633ff");
            return encodeGif(
              [
                ...Array(20).fill(first),
                ...Array(20).fill(second),
                ...Array(FRAME_COUNT - 40).fill(first),
              ],
              true,
            );
          }
          ''',
              "add grouped duplicate fixture",
          )

          test = replace_once(
              test,
              '''async function expectPreservedOutputs(
            input: Buffer,
            expectedOutputPages = FRAME_COUNT,
          ): Promise<void> {
          ''',
              '''async function expectPreservedOutputs(
            input: Buffer,
            expectedOutputPages = FRAME_COUNT,
            expectedDelays: number[] | undefined =
              expectedOutputPages > 1
                ? Array(FRAME_COUNT).fill(FRAME_DELAY_MS)
                : undefined,
          ): Promise<void> {
          ''',
              "allow coalesced expected delays",
          )

          test = replace_once(
              test,
              '''    if (expectedOutputPages > 1) {
                  expect(metadata.delay).toEqual(
                    Array(FRAME_COUNT).fill(FRAME_DELAY_MS),
                  );
                  expect(metadata.loop).toBe(0);
                } else {
          ''',
              '''    if (expectedOutputPages > 1) {
                  expect(metadata.delay).toEqual(expectedDelays);
                  expect(
                    metadata.delay?.reduce((total, delay) => total + delay, 0),
                  ).toBe(FRAME_COUNT * FRAME_DELAY_MS);
                  expect(metadata.loop).toBe(0);
                } else {
          ''',
              "verify coalesced timing",
          )

          test = replace_once(
              test,
              '''  test("accepts encoder-coalesced duplicate frames", async () => {
          ''',
              '''  test("accepts encoder-coalesced duplicate frame runs", async () => {
            const input = await groupedDuplicateFrameGif();
            const direct = await sharp(input, { animated: true, pages: -1 })
              .webp({ quality: 85, effort: 4 })
              .toBuffer();
            const directMetadata = await sharp(direct, {
              animated: true,
              pages: -1,
            }).metadata();
            const directPages = directMetadata.pages ?? 1;

            expect(directPages).toBeGreaterThan(1);
            expect(directPages).toBeLessThan(FRAME_COUNT);
            expect(directMetadata.delay).toBeDefined();

            await expectPreservedOutputs(
              input,
              directPages,
              directMetadata.delay,
            );
          });

          test("accepts encoder-coalesced duplicate frames", async () => {
          ''',
              "add grouped coalescing regression",
          )

          test_path.write_text(test)

          readme_path = Path("README.md")
          readme = readme_path.read_text()
          readme = replace_once(
              readme,
              '''- `preserve`: all frames and timing are retained within page, duration, raw,
            pixel, byte, and deadline budgets.
          ''',
              '''- `preserve`: visual animation semantics are retained within page, duration,
            raw, pixel, byte, and deadline budgets. The WebP encoder may coalesce
            consecutive equivalent frames, including emitting a static WebP when every
            decoded frame is identical. Animated outputs are re-opened to verify total
            duration and loop count, and the manifest reports the verified encoded page
            count.
          ''',
              "document WebP frame coalescing",
          )
          readme_path.write_text(readme)
          PY

      - name: Format changed files
        run: bun x prettier --write src/image.ts src/image.animation-regression.test.ts README.md

      - name: Validate types and focused regression tests
        run: bun run typecheck && bun test src/image.animation-regression.test.ts

      - name: Commit fix to PR branch
        run: |
          rm .github/workflows/agent-pr25-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/image.ts src/image.animation-regression.test.ts README.md .github/workflows/agent-pr25-fix.yml
          git commit -m "fix: verify coalesced animation output metadata"
          git push origin HEAD:fix/animated-raw-fanout-logging
