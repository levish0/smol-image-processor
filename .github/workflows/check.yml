name: check

on:
  push:
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Show Prettier output for regression test
        run: |
          bunx prettier --write src/image.animation-regression.test.ts
          git diff -- src/image.animation-regression.test.ts

      - name: Check contracts, formatting, types, tests, and build
        run: bun run check
